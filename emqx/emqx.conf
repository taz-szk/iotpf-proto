node {
  name = "emqx@127.0.0.1"
  data_dir = "/opt/emqx/data"
}

cluster {
  name = iotplatform
  discovery_strategy = manual
}

dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/root_ca.crt"
    certfile   = "/opt/emqx/etc/certs/server.crt"
    keyfile    = "/opt/emqx/etc/certs/server.key"
    verify     = verify_peer
    fail_if_no_peer_cert = true
    versions   = ["tlsv1.3", "tlsv1.2"]
  }
  max_connections = 50000
}

listeners.tcp.default {
  enabled = false
}

authentication = [
  {
    mechanism = certificate
    enable    = true
    from      = cn
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

mqtt {
  max_packet_size = 1MB
  max_qos_allowed = 2
  retain_available = true
  keepalive_check_interval = 30s
}
