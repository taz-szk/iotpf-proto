node {
  name = "emqx@127.0.0.1"
  data_dir = "/opt/emqx/data"
}

cluster {
  name = iotplatform
  discovery_strategy = manual
}

dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile           = "/opt/emqx/etc/certs/root_ca.crt"
    certfile             = "/opt/emqx/etc/certs/server.crt"
    keyfile              = "/opt/emqx/etc/certs/server.key"
    verify               = verify_peer
    fail_if_no_peer_cert = true
    versions             = ["tlsv1.3", "tlsv1.2"]
  }
  max_connections = 50000
}

listeners.tcp.default {
  enabled = false
}

# P2: HTTP認証バックエンド経由でJWT + mTLSの組み合わせで検証
authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://core-api:8000/emqx/auth"
    headers {
      "Content-Type" = "application/json"
    }
    body {
      username = "${username}"
      clientid = "${clientid}"
      peerhost = "${peerhost}"
      cert_common_name = "${cert_common_name}"
    }
  }
]

# P2: HTTP認可バックエンド経由でトピック/アクション制御
authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://core-api:8000/emqx/acl"
      headers {
        "Content-Type" = "application/json"
      }
      body {
        username = "${username}"
        clientid = "${clientid}"
        topic = "${topic}"
        action = "${action}"
        peerhost = "${peerhost}"
      }
    }
  ]
}

mqtt {
  max_packet_size = 1MB
  max_qos_allowed = 2
  retain_available = true
  keepalive_check_interval = 30s
}
