node {
  name = "emqx@127.0.0.1"
  data_dir = "/opt/emqx/data"
}

cluster {
  name = iotplatform
  discovery_strategy = manual
}

dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile           = "/opt/emqx/etc/certs/root_ca.crt"
    certfile             = "/opt/emqx/etc/certs/server.crt"
    keyfile              = "/opt/emqx/etc/certs/server.key"
    verify               = verify_peer
    fail_if_no_peer_cert = true
    versions             = ["tlsv1.3", "tlsv1.2"]
  }
  max_connections = 50000
}

listeners.tcp.default {
  enabled = false
}

# P1: TLS層でCA署名済み証明書を要求（mTLS）。MQTT認証レイヤーは不要。
# CN抽出によるデバイス識別はP2でHTTP認可バックエンド経由で実装。
authentication = []

# P1: mTLS通過済みの接続は全トピック許可。P2でHTTP認可に置き換え。
authorization {
  no_match = allow
  deny_action = ignore
  sources = []
}

mqtt {
  max_packet_size = 1MB
  max_qos_allowed = 2
  retain_available = true
  keepalive_check_interval = 30s
}
