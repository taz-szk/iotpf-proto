%% P1暫定ACL: mTLS認証済みデバイスのみ接続可（トピック境界はP2でHTTP認可に移行）
%% CN形式: {tenant_id}:{device_id}

%% 認証済みクライアントにtelemetry/status publishを許可
{allow, {user, {re, "^.+:.+$"}}, publish,   ["/+/devices/+/telemetry"]}.
{allow, {user, {re, "^.+:.+$"}}, publish,   ["/+/devices/+/status"]}.
{allow, {user, {re, "^.+:.+$"}}, subscribe, ["/+/devices/+/commands"]}.

%% 未認証・パターン不一致はすべて拒否
{deny, all}.
