<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定 - IoTAirx</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #1f2937; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    label { display: block; margin-top: 1rem; font-size: 0.875rem; color: #4b5563; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #d1d5db; border-radius: 0.375rem; box-sizing: border-box; }
    button { margin-top: 1.5rem; width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 0.375rem; font-size: 1rem; cursor: pointer; }
    button:disabled { background: #93c5fd; cursor: wait; }
    #error { color: #dc2626; margin-top: 1rem; font-size: 0.875rem; }
    #success { text-align: center; }
    a.button { display: inline-block; margin-top: 1.5rem; padding: 0.75rem 1.5rem; background: #2563eb; color: white; border-radius: 0.375rem; text-decoration: none; }
  </style>
</head>
<body>
  <div id="invalid-token" style="display:none;">
    <h1>リンクが無効です</h1>
    <p id="invalid-message">リンクが無効か期限切れです。もう一度パスワード再設定をお試しください。</p>
    <a class="button" href="/admin/forgot-password.html">パスワード再設定をやり直す</a>
  </div>
  <div id="form-wrap">
    <h1>新しいパスワードを設定</h1>
    <form id="reset-password-form">
      <label>新しいパスワード(12文字以上)<input type="password" id="new_password" required minlength="12"></label>
      <label>新しいパスワード(確認用)<input type="password" id="new_password_confirm" required minlength="12"></label>
      <button type="submit" id="submit-btn">パスワードを更新する</button>
      <div id="error"></div>
    </form>
  </div>
  <div id="success" style="display:none;">
    <h1>パスワードを更新しました</h1>
    <a class="button" href="/admin/tenant-login.html">ログインページへ</a>
  </div>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      document.getElementById('form-wrap').style.display = 'none';
      document.getElementById('invalid-token').style.display = 'block';
    }

    document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      const newPassword = document.getElementById('new_password').value;
      const newPasswordConfirm = document.getElementById('new_password_confirm').value;
      if (newPassword !== newPasswordConfirm) {
        errorEl.textContent = 'パスワードが一致しません。';
        return;
      }
      if (new TextEncoder().encode(newPassword).length > 72) {
        errorEl.textContent = 'パスワードは72バイト以下にしてください。';
        return;
      }

      btn.disabled = true;
      try {
        const resp = await fetch('/api/tenant-auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: newPassword }),
        });
        if (resp.status === 404 || resp.status === 410) {
          document.getElementById('form-wrap').style.display = 'none';
          document.getElementById('invalid-token').style.display = 'block';
          return;
        }
        if (!resp.ok) {
          // パスワードポリシー違反(400)等。トークンはまだ有効なのでフォームは残す。
          const body = await resp.json().catch(() => ({}));
          errorEl.textContent = typeof body.detail === 'string'
            ? body.detail
            : 'パスワードが要件を満たしていません。';
          btn.disabled = false;
          return;
        }
        document.getElementById('form-wrap').style.display = 'none';
        document.getElementById('success').style.display = 'block';
      } catch (err) {
        errorEl.textContent = '通信エラーが発生しました。';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
