<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード変更 - IoTAir-X 管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="/admin/js/api.js?v=8"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
    <div class="text-2xl font-black tracking-tight text-blue-600">IoTAir<span class="text-gray-700">-X</span></div>
    <div class="flex items-center gap-4">
      <a href="/admin/tenants.html" class="text-sm text-gray-500 hover:text-gray-700">← 一覧に戻る</a>
      <button onclick="api.logout()" class="text-sm text-gray-500 hover:text-gray-700">ログアウト</button>
    </div>
  </nav>

  <div class="max-w-sm mx-auto px-6 py-12" x-data="adminChangePasswordApp()">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <h1 class="text-xl font-bold text-gray-800 mb-1">パスワード変更</h1>
      <p class="text-sm text-gray-500 mb-6">管理者アカウントのパスワードを変更します</p>

      <div x-show="error" class="bg-red-50 border border-red-200 text-red-600 rounded px-4 py-2 mb-4 text-sm" x-text="error"></div>
      <div x-show="success" class="bg-green-50 border border-green-200 text-green-700 rounded px-4 py-2 mb-4 text-sm">
        パスワードを変更しました。一覧ページに戻ります...
      </div>

      <form @submit.prevent="submit" class="space-y-4" x-show="!success">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">現在のパスワード</label>
          <input type="password" x-model="form.current_password" required
                 class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">新しいパスワード（8文字以上）</label>
          <input type="password" x-model="form.new_password" required minlength="8"
                 class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">新しいパスワード（確認）</label>
          <input type="password" x-model="form.confirm_password" required
                 class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" :disabled="loading"
                class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-medium py-2 rounded text-sm">
          <span x-show="!loading">パスワードを変更する</span>
          <span x-show="loading">変更中...</span>
        </button>
        <a href="/admin/tenants.html"
           class="block text-center text-sm text-gray-500 hover:text-gray-700">キャンセル</a>
      </form>
    </div>
  </div>

  <script>
    function adminChangePasswordApp() {
      return {
        form: { current_password: '', new_password: '', confirm_password: '' },
        loading: false,
        error: '',
        success: false,

        init() {
          if (!api.isLoggedIn()) { window.location.href = '/admin/'; }
        },

        async submit() {
          this.error = '';
          if (this.form.new_password !== this.form.confirm_password) {
            this.error = '新しいパスワードが一致しません';
            return;
          }
          this.loading = true;
          try {
            await api.auth.changePassword(this.form.current_password, this.form.new_password);
            this.success = true;
            setTimeout(() => { window.location.href = '/admin/tenants.html'; }, 2000);
          } catch(e) {
            this.error = e.message || 'パスワードの変更に失敗しました';
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
</body>
</html>
