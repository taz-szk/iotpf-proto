<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoTAir-X - ログイン</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="/admin/js/api.js?v=2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div x-data="loginApp()" class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
    <div class="flex flex-col items-center mb-6">
      <img src="/admin/IoTAirx_logo.png" alt="IoTAirx" class="h-16 mb-2">
      <span class="text-sm text-gray-500">管理画面</span>
    </div>

    <div x-show="error" class="bg-red-50 border border-red-300 text-red-700 rounded px-4 py-3 mb-4 text-sm" x-text="error"></div>

    <form @submit.prevent="login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
        <input type="email" x-model="email" required
               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="admin@example.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">パスワード</label>
        <input type="password" x-model="password" required
               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button type="submit" :disabled="loading"
              class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-medium py-2 px-4 rounded-lg transition">
        <span x-show="!loading">ログイン</span>
        <span x-show="loading">ログイン中...</span>
      </button>
    </form>
  </div>

  <script>
    function loginApp() {
      return {
        email: '',
        password: '',
        loading: false,
        error: '',
        async login() {
          this.loading = true;
          this.error = '';
          try {
            const data = await api.login(this.email, this.password);
            if (data.status === 'totp_required') {
              setPartialToken(data.partial_token);
              window.location.href = '/admin/totp-verify.html';
            } else if (data.status === 'totp_setup_required') {
              setPartialToken(data.partial_token);
              window.location.href = '/admin/totp-setup.html';
            } else {
              api.setTokens(data.access_token, data.refresh_token);
              window.location.href = '/admin/tenants.html';
            }
          } catch(e) {
            this.error = e.message || 'ログインに失敗しました';
          } finally {
            this.loading = false;
          }
        },
        init() {
          if (api.isLoggedIn()) window.location.href = '/admin/tenants.html';
        }
      };
    }
  </script>
</body>
</html>
