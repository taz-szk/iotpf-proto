<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定 - IoTAirx</title>
  <script src="https://www.google.com/recaptcha/api.js?render=__RECAPTCHA_SITE_KEY__"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #1f2937; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    label { display: block; margin-top: 1rem; font-size: 0.875rem; color: #4b5563; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #d1d5db; border-radius: 0.375rem; box-sizing: border-box; }
    button { margin-top: 1.5rem; width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 0.375rem; font-size: 1rem; cursor: pointer; }
    button:disabled { background: #93c5fd; cursor: wait; }
    #notice { margin-top: 1rem; font-size: 0.875rem; color: #4b5563; }
    #back-link { margin-top: 1rem; font-size: 0.875rem; }
  </style>
</head>
<body>
  <h1>パスワード再設定</h1>
  <form id="forgot-password-form">
    <label>テナントスラッグ<input type="text" id="tenant_slug" required></label>
    <label>メールアドレス<input type="email" id="email" required></label>
    <button type="submit" id="submit-btn">再設定メールを送る</button>
    <div id="notice" style="display:none;">
      該当するアカウントがあれば数分以内にメールが届きます。届かない場合はメールアドレスが間違っている可能性があります。
    </div>
  </form>
  <div id="back-link"><a href="/admin/tenant-login.html">ログイン画面に戻る</a></div>
  <script>
    document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const noticeEl = document.getElementById('notice');
      btn.disabled = true;
      try {
        const token = await grecaptcha.execute('__RECAPTCHA_SITE_KEY__', { action: 'forgot_password' });
        await fetch('/api/tenant-auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tenant_slug: document.getElementById('tenant_slug').value,
            email: document.getElementById('email').value,
            recaptcha_token: token,
          }),
        });
      } catch (err) {
        // ネットワークエラー等でも、存在確認に使われないよう同じ注記を表示する
      } finally {
        noticeEl.style.display = 'block';
        btn.disabled = true;
      }
    });
  </script>
</body>
</html>
