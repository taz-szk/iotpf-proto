<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2段階認証の設定 - IoTAir-X</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/admin/js/api.js?v=11"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 w-full max-w-md">
    <h1 class="text-xl font-bold text-gray-800 mb-2">2段階認証を設定</h1>
    <p class="text-sm text-gray-500 mb-6">Google Authenticator などの認証アプリで QR コードをスキャンしてください。</p>
    <div id="error" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded px-3 py-2"></div>
    <div id="loading" class="text-center py-8 text-gray-400">読み込み中...</div>
    <div id="content" class="hidden">
      <div id="qrcode" class="flex justify-center mb-4"></div>
      <details class="mb-4">
        <summary class="text-xs text-gray-400 cursor-pointer">QR が読めない場合はこちら（手動入力）</summary>
        <code id="secret" class="text-xs bg-gray-100 rounded px-2 py-1 mt-1 block break-all"></code>
      </details>
      <form id="form">
        <label class="block text-sm font-medium text-gray-700 mb-1">設定後に表示される 6 桁のコードを入力</label>
        <input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
               placeholder="000000" required
               class="w-full border border-gray-300 rounded px-3 py-2 text-center text-2xl tracking-widest mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded">
          設定を完了する
        </button>
      </form>
    </div>
  </div>
  <script>
    if (!sessionStorage.getItem('iot_partial_token')) {
      window.location.href = '/admin/';
    }
    (async () => {
      try {
        const data = await api.totpPartial.setup();
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        new QRCode(document.getElementById('qrcode'), { text: data.otpauth_uri, width: 200, height: 200 });
        document.getElementById('secret').textContent = data.secret;
      } catch (err) {
        document.getElementById('loading').textContent = err.message || '読み込みに失敗しました';
      }
    })();
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('code').value.trim();
      const errEl = document.getElementById('error');
      errEl.classList.add('hidden');
      try {
        const data = await api.totpPartial.activate(code);
        api.setTokens(data.access_token, data.refresh_token);
        clearPartialToken();
        window.location.href = '/admin/tenants.html';
      } catch (err) {
        errEl.textContent = err.message || '設定に失敗しました';
        errEl.classList.remove('hidden');
        document.getElementById('code').value = '';
      }
    });
  </script>
</body>
</html>
