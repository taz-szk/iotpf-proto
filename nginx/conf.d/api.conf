server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_trusted_certificate /etc/nginx/certs/root_ca.crt;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s;

    # Rate-limited login endpoints (must appear before the general /api/ block)
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        set $core_api http://core-api:8000;
        rewrite ^/api(/.*) $1 break;
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /api/tenant-auth/login {
        limit_req zone=login burst=5 nodelay;
        set $core_api http://core-api:8000;
        rewrite ^/api(/.*) $1 break;
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /api/signup {
        limit_req zone=signup burst=5 nodelay;
        set $core_api http://core-api:8000;
        rewrite ^/api(/.*) $1 break;
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 外部BIツール向け準リアルタイムアクセス（InfluxDBへの純粋なパススルー）。
    # 認証・認可・テナント識別は一切行わない。Authorization ヘッダーはそのまま InfluxDB に渡り、
    # InfluxDB 側でトークンを評価する。
    # 公開するのはクエリ系のエンドポイントのみ。signin/setup/write/認可管理/metrics/debug等の
    # InfluxDB管理・書き込み系は外部に出さない（パスの許可リストであり、認可ロジックではない）。
    location ~ ^/influx(/api/v2/(query|query/analyze|query/suggestions|buckets)|/query|/health|/ping)$ {
        limit_req zone=influx_query burst=50 nodelay;
        limit_req_status 429;
        set $influxdb http://influxdb:8086;
        rewrite ^/influx(/.*) $1 break;
        proxy_pass $influxdb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 全文書の再インデックスは対象ドキュメント数×埋め込み呼び出しの逐次処理のため、
    # CPU推論環境では300秒でも不足しうる（管理者が明示的に実行する一回限りの操作なので長めに確保）。
    location = /api/platform/assistant/reindex {
        set $core_api http://core-api:8000;
        rewrite ^/api(/.*) $1 break;
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 900s;
    }

    # ファームウェアのアップロード(最大100MB + multipart分)。他のAPIは小さい上限のまま。
    location ~ ^/api/(tenants/[^/]+/firmware|tenant-portal/me/firmware)$ {
        client_max_body_size 110m;
        set $core_api http://core-api:8000;
        rewrite ^/api(/.*) $1 break;
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    # EMQXからcore-apiへの内部専用フック(認証・ACL)。ブローカーはdockerネットワーク内で直接呼ぶため、
    # 外部公開する理由がない(デバイスの登録有無を探る手掛かりになる)。
    location ^~ /api/emqx/ {
        return 404;
    }

    # AIアシスタントのchat/confirm-actionはCPU推論のため時間がかかる想定
    # （tenant-portal/me/assistant/はテナント管理者向けウィジェットの問いかけ・確認実行経路）
    location ~ ^/api/(tenants/[^/]+/assistant/|platform/assistant/|tenant-portal/me/assistant/) {
        set $core_api http://core-api:8000;
        rewrite ^/api(/.*) $1 break;
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    location /api/ {
        set $core_api http://core-api:8000;
        rewrite ^/api(/.*) $1 break;
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /provision {
        set $core_api http://core-api:8000;
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 公開ダッシュボードURL — 認証なしで core-api の /public/{token} へ転送
    location /public/ {
        set $core_api http://core-api:8000;
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Grafana — auth_request で iot_token Cookie を検証してから転送
    location /grafana/ {
        auth_request /internal/verify-jwt;
        auth_request_set $auth_user $upstream_http_x_auth_user;

        set $grafana http://172.30.0.10:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        error_page 401 = @grafana_unauthorized;
    }

    # auth_request 用内部サブリクエスト（外部からアクセス不可）
    location = /internal/verify-jwt {
        internal;
        set $core_api http://core-api:8000;
        proxy_pass $core_api/auth/verify-jwt;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Cookie なし → テナントログインページへ
    location @grafana_unauthorized {
        return 302 /admin/tenant-login.html;
    }

    # テナント向けページ・共有アセット(static/js/画像)。プラットフォーム管理者
    # ページはここには置かない(推測されやすい/adminに管理者ログインを置かない)。
    # forgot-password.html が reCAPTCHA v3 を読み込むため、/signup/ と同様にCSPを緩める
    # (locationでadd_headerを使うとhttpブロックから継承したadd_headerは全て無効になるため、
    # 基本セキュリティヘッダーもここで再指定し、既存ページが使うAlpine.js用の'unsafe-eval'も維持する)。
    location /admin/ {
        alias /usr/share/nginx/admin-ui/;
        index tenant-login.html;
        try_files $uri $uri/ /admin/tenant-login.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; frame-src 'self' https://www.google.com/recaptcha/; connect-src 'self' https://www.google.com/recaptcha/; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;
    }

    # プラットフォーム管理者専用ページ。パスは非公開情報として扱うこと。
    location /iotairx-console/ {
        alias /usr/share/nginx/platform-ui/;
        index index.html;
        try_files $uri $uri/ /iotairx-console/index.html;
    }

    # 公開セルフサインアップページ。認証不要。
    # reCAPTCHA v3 を読み込むため、このlocation専用にCSPを緩める
    # (locationでadd_headerを使うとhttpブロックから継承したadd_headerは全て無効になるため、
    # 基本セキュリティヘッダーもここで再指定する)。
    location /signup/ {
        alias /usr/share/nginx/public-ui/;
        index signup.html;
        try_files $uri $uri/ /signup/signup.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src 'self' https://www.google.com/recaptcha/; connect-src 'self' https://www.google.com/recaptcha/; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;
    }

    location /docs/ {
        alias /usr/share/nginx/docs/;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
