user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$request_time tenant=$http_x_tenant_id';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # 既定は小さく絞る。ファームウェアのアップロード経路(api.conf)だけ個別に引き上げる。
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # 'unsafe-eval': admin-ui/platform-ui は Alpine.js を使用しており、
    # ディレクティブ式(x-show, x-data 等)の評価に new Function() を利用するため必須。
    # 参考: https://alpinejs.dev/advanced/csp (CSPを維持したい場合は @alpinejs/csp ビルドへの移行を検討)
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # UIは外部CDN・外部フォントを使わない(Tailwind/Alpine/QRCodeはローカル配信)ため、外部ホストは許可しない。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/conf.d/*.conf;
}
